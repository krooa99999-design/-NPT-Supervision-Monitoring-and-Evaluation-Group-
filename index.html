<style>

.wrap{max-width:1180px;margin:0 auto;padding:16px}
.two{display:grid;grid-template-columns:250px 1fr;gap:20px}

aside a:hover{background:var(--head)}

.arr.l{left:0;border-radius:0 8px 8px 0}.arr.r{right:0;border-radius:8px 0 0 8px}

.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:18px}

.txt{white-space:pre-line;margin:6px 0 10px}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:15px;min-width:420px}
th,td{border:1px solid var(--line);padding:7px 10px;text-align:left;vertical-align:top}

.news a{display:flex;gap:12px;padding:10px 4px;border-bottom:1px dashed var(--line);text-decoration:none}

.pm{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:100;display:grid;place-items:center;padding:16px;overflow:auto}
.pm .box{position:relative;max-width:640px;width:100%;margin:auto;background:var(--card);border:1px solid var(--line);border-top:5px solid var(--gold);border-radius:14px;padding:22px 20px;max-height:92vh;overflow:auto}

footer{background:var(--navy2);color:#cfd8ee;text-align:center;padding:18px;font-size:14px;margin-top:20px}
h3.sec{margin:18px 0 8px;color:var(--navy);border-left:5px solid var(--gold);padding-left:10px}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) h3.sec{color:#fff}}
</style>

ูลล่าสุดจาก DMC · ภาคเรียนที่ 1/2569 (10 มิ.ย.)","cols":["จังหวัด","นักเรียนชาย","นักเรียนหญิง","รวม","ห้องเรียน"],"rows":[["นครปฐม","18,107 คน","19,399 คน","37,506 คน","1,094 ห้องเรียน"]],"images":[],"paras":[]},{"title":"ขอบข่ายงานกลุ่มนิเทศ ติดตาม และประเมินผลการจัดการศึกษา","text":"กลุ่มนิเทศ ติดตาม และประเมินผลการจัดการศึกษา ดำเนินการเกี่ยวกับการนิเทศการศึกษา วิเคราะห์ วิจัย ติดตาม ตรวจสอบ และประเมินผลการพัฒนาระบบการบริหารและการจัดการศึกษา เพื่อให้สถานศึกษามีความเข้มแข็งและจัดการเรียนการสอนได้อย่างมีคุณภาพ ได้มาตรฐานเท่าเทียมกัน โดยยึดโรงเรียนเป็นฐาน","cols":["ชื่อ","ตำแหน่ง / วิทยฐานะ","หน้าที่รับผิดชอบ"],"rows":[["","ศึกษานิเทศก์",""]],"images":[],"paras":[],"people":[{"photo":"","name":"1.นางสาวกุลธิดา สิทธิมงคล ตำแหน่งเลขที่ 5","pos":"ศึกษานิเทศก์ศึกษานิเทศก์ วิทยฐานะศึกษานิเทศก์ ชำนาญการพิเศษ","rank":"ปฏิบัติหน้าที่ผู้อำนวยการกลุ่มนิเทศ ติดตามและประเมินผลการจัดการศึกษา","duty":"1. อำนวยการ ส่งเสริม สนับสนุน นิเทศ กำกับติดตาม ตรวจสอบพิจารณางานในกลุ่มนิเทศ ติดตาม และประเมินผลการจัดการศึกษา ให้เป็นไปตามกฎหมาย ระเบียบ ข้อบังคับ นโยบายทางราชการ ติดตาม\nการปฏิบัติงานของบุคลากรในกลุ่มงาน ได้แก่\n1.1 กลุ่มงานส่งเสริม สนับสนุน พัฒนาหลักสูตรการศึกษาขั้นพื้นฐาน และหลักสูตรการศึกษาพิเศษ\n1.2 กลุ่มงานส่งเสริมและพัฒนากระบวนการจัดการเรียนรู้\n1.3 กลุ่มงานส่งเสริมพัฒนาระบบประกันคุณภาพการศึกษา\n1.4 กลุ่มงานส่งเสริมและพัฒนาการวัดและประเมินผล\n1.5 กลุ่มงานนิเทศ ติดตาม และประเมินผลการบริหารและการจัดการศึกษา\n1.6 กลุ่มงานสื่อ นวัตกรรม และเทคโนโลยีทางการศึกษา\n1.7 กลุ่มงานเลขานุการคณะกรรมการติดตาม ตรวจสอบ ประเมินผล และนิเทศการศึกษา\n1.8 กลุ่มงานเลขานุการกลุ่มนิเทศ ติดตาม และประเมินผลการจัดการศึกษา\n1.9 กลุ่มงานงานสารบรรณ\n2. งานตามภารกิจกลุ่มนิเทศ ติดตามและประเมินผลการจัดการศึกษา\n2.1 หัวหน้ากลุ่มงานส่งเสริมและพัฒนาการวัดและประเมินผล\n2.2 กลุ่มงานส่งเสริม สนับสนุน พัฒนาหลักสูตรการศึกษาขั้นพื้นฐาน และหลักสูตรการศึกษาพิเศษ\n2.3 กลุ่มงานเลขานุการกลุ่มนิเทศ ติดตาม และประเมินผลการจัดการศึกษา\n3. กลุ่มสาระการเรียนรู้\n3.1 กลุ่มสาระการเรียนรู้ภาษาไทย\n3.2 กิจกรรมพัฒนาผู้เรียน (กิจกรรม }
let baseSha;/* sha ของ data.json ตอนที่โหลดมาแก้ไข (null = ยังไม่มีไฟล์) */
const u8s=b=>new TextDecoder().decode(Uint8Array.from(atob(b.replace(/\s/g,'')),c=>c.charCodeAt(0)));
async function loadLatest(){
 if(location.protocol==='file:')return true;
 if(!getGH()){toast('ยังไม่ได้เชื่อมต่อ GitHub — ไม่พบ auth.json หรือยังไม่ได้ตั้งค่าผู้ดูแล จึงยังบันทึกขึ้นเว็บไม่ได้');return false}
 toast('กำลังดึงข้อมูลล่าสุดจาก GitHub...');
 try{
  const g=await ghReq('data.json','GET');
  if(g.status===404){baseSha=null;return true}
  if(!g.ok){let m=g.status;try{m=(await g.json()).message||m}catch(e){}throw new Error(m)}
  const j=await g.json();let txt;
  if(j.content)txt=u8s(j.content);
  else{const c=getGH();const r=await fetch(`https://api.github.com/repos/${c.owner}/${c.repo}/contents/data.json?ref=${encodeURIComponent(c.branch)}`,{cache:'no-store',headers:{Authorization:'Bearer '+c.token,Accept:'application/vnd.github.raw'}});if(!r.ok)throw new Error('อ่านไฟล์ไม่สำเร็จ ('+r.status+')');txt=await r.text()}
  S=JSON.parse(txt);norm();baseSha=j.sha;return true;
 }catch(e){toast('ดึงข้อมูลล่าสุดไม่สำเร็จ: '+(e.message||e)+' — ยังไม่เข้าโหมดแก้ไขเพื่อป้องกันข้อมูลถูกเขียนทับ');return false}
}
async function ghSave(){
 toast('กำลังบันทึกขึ้น GitHub...');
 try{
  const g=await ghReq('data.json','GET');let cur=null;
  if(g.ok)cur=(await g.json()).sha;else if(g.status!==404)throw new Error('อ่านไฟล์ไม่สำเร็จ ('+g.status+')');
  if(baseSha!==undefined&&cur!==baseSha&&!confirm('มีผู้อื่นบันทึกข้อมูลขึ้นเว็บไปแล้วหลังจากที่คุณเริ่มแก้ไข\nต้องการบันทึกทับข้อมูลนั้นหรือไม่?\n(กดยกเลิก แล้วกด “ส่งออก data.json” เก็บงานไว้ก่อน จากนั้นรีเฟรชหน้าเพื่อดึงข้อมูลล่าสุด)')){dirty=true;toast('ยกเลิกการบันทึก');return}
  await pack(S,{});const ns=await ghPut('data.json',b64(JSON.stringify(S,null,1)),'update data',false,cur||undefined);if(ns)baseSha=ns;dirty=false;render();toast('บันทึกขึ้น GitHub แล้ว — เว็บจะอัปเดตภายใน 1–2 นาที')}
 catch(e){dirty=true;toast('บันทึกไม่สำเร็จ: '+(e.message||e))}
}
async function standalone(){
 const f=location.protocol==='file:';
 if(!f){try{const r=await fetch('data.json?v='+Date.now(),{cache:'no-store'});if(r.ok){S=await r.json();norm()}}catch(e){}$('adm').style.display='inline'}
 canEdit=f||!!getGH();render();
}
function adminDialog(){
 const c=getGH()||{},h=location.hostname,gp=h.endsWith('.github.io');
 const d=document.createElement('div');
 d.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:100;display:grid;place-items:center;padding:16px;overflow:auto';
 d.innerHTML=`<div class="card" style="max-width:480px;width:100%;margin:0"><h2>ผู้ดูแลระบบ (เชื่อมต่อ GitHub)</h2><p style="color:var(--mute);font-size:14px;margin:4px 0 10px">${c.token?'เชื่อมต่อแล้ว — ':''}ใส่ข้อมูลที่เก็บเว็บบน GitHub และ Personal Access Token (สิทธิ์ Contents: Read and write เฉพาะ repo นี้) ข้อมูลนี้เก็บไว้ในเบราว์เซอร์เครื่องนี้เท่านั้น</p><label>ชื่อบัญชี (owner)<input id="g1" value="${esc(c.owner||(gp?h.split('.')[0]:''))}"></label><label>ชื่อ repository<input id="g2" value="${esc(c.repo||(gp?(location.pathname.split('/')[1]||h):''))}"></label><label>branch<input id="g3" value="${esc(c.branch||'main')}"></label><label>Token<input id="g4" type="password" value="${esc(c.token||'')}"></label><p id="gm" style="color:#c0392b;margin:8px 0"></p><div class="tools"><button class="pri" id="gok">เชื่อมต่อ</button><button id="gno">ปิด</button>${c.token?'<button class="dng" id="gout">ออกจากระบบผู้ดูแล</button>':''}</div></div>`;
 document.body.appendChild(d);
 const q=i=>d.querySelector(i);
 q('#gno').onclick=()=>d.remove();
 if(q('#gout'))q('#gout').onclick=()=>{localStorage.removeItem(GH_KEY);canEdit=false;edit=false;d.remove();render();toast('ออกจากระบบผู้ดูแลแล้ว')};
 q('#gok').onclick=async()=>{
  const n={owner:q('#g1').value.trim(),repo:q('#g2').value.trim(),branch:q('#g3').value.trim()||'main',token:q('#g4').value.trim()};
  q('#gm').textContent='กำลังตรวจสอบ...';
  try{
   const r=await fetch(`https://api.github.com/repos/${n.owner}/${n.repo}`,{headers:{Authorization:'Bearer '+n.token,Accept:'application/vnd.github+json'}});
   if(!r.ok)throw new Error('ตรวจสอบไม่ผ่าน ('+r.status+') — เช็กชื่อบัญชี ชื่อ repo และ token');
   const j=await r.json();
   if(j.permissions&&j.permissions.push===false)throw new Error('token นี้ไม่มีสิทธิ์เขียนไฟล์ (ต้องเป็น Contents: Read and write)');
   localStorage.setItem(GH_KEY,JSON.stringify(n));canEdit=true;d.remove();render();toast('เชื่อมต่อแล้ว กดปุ่ม ✏️ แก้ไขข้อมูล ได้เลย');
  }catch(e){q('#gm').textContent=e.message||String(e)}
 };
}
$('adm').onclick=e=>{e.preventDefault();adminDialog()};
window.addEventListener('beforeunload',e=>{if(dirty&&edit){e.preventDefault();e.returnValue=''}});
function setp(path,v){const p=path.split('.');let o=S;for(let i=0;i<p.length-1;i++)o=o[p[i]];o[p[p.length-1]]=v}
function shrink(f){return new Promise(r=>{const i=new Image();i.onload=()=>{const k=Math.min(1,1400/i.width),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);r(c.toDataURL('image/jpeg',.82))};i.src=URL.createObjectURL(f)})}
async function save(){
 dirty=false;const j=JSON.stringify(S);
 if(dbDoc){try{await dbDoc.set({json:j});toast('บันทึกข้อมูลเรียบร้อย');try{localStorage.setItem('npt-nitet',j)}catch(e){}}catch(e){toast('บันทึกไม่สำเร็จ: '+((e&&e.message)||''))}}
 else if(getGH()){await ghSave()}
 else if(location.protocol==='file:'){try{localStorage.setItem('npt-nitet',j);toast('บันทึกในเครื่องนี้แล้ว (ใช้ไฟล์ในเครื่อง)')}catch(e){toast('บันทึกไม่สำเร็จ')}}
  else{dirty=true;toast('บันทึกไม่สำเร็จ: ยังไม่ได้เชื่อมต่อ GitHub (ไม่พบ auth.json) — กด “ส่งออก data.json” เพื่อเก็บงานไว้ก่อน')}
}
document.addEventListener('input',e=>{const k=e.target.dataset&&e.target.dataset.k;if(k){setp(k,e.target.value);dirty=true}});
$('file').addEventListener('change',async e=>{
 const f=e.target.files[0];e.target.value='';if(!f||tgt==null)return;
 toast('กำลังอัปโหลดรูป...');
 try{
  const url=assets?(await assets.upload(f)).url:await shrink(f);
  if(tgt==='b')S.banners.push({url,title:''});else if(tgt==='logo')S.logo=url;else if(tgt&&tgt.p)S.sections[tgt.p[0]].people[tgt.p[1]].photo=url;else if(tgt&&tgt.e)S.sections[tgt.e[0]].entries[tgt.e[1]].photo=url;else if(tgt&&tgt.q)S.sections[tgt.q[0]].paras[tgt.q[1]].photo=url;else S.sections[+tgt].images.push(url);
  render();toast('เพิ่มรูปแล้ว — อย่าลืมกด “บันทึก”');
 }catch(err){toast('อัปโหลดไม่สำเร็จ')}
});
document.addEventListener('click',async e=>{
 const b=e.target.closest('[data-a]');if(!b)return;
 const [a,x,y]=b.dataset.a.split(':'),s=S.sections[+x];
 if(a==='suplogin'){supDialog();return}
  else if(a==='suplogout'){supLogout();return}
  else if(a==='edit'){if(!(await loadLatest()))return;edit=true}
 else if(a==='export'){const bl=new Blob([JSON.stringify(S,null,1)],{type:'application/json'});const u=URL.createObjectURL(bl);const l=document.createElement('a');l.href=u;l.download='data.json';l.click();return}
 else if(a==='done'){if(dirty&&!confirm('มีการแก้ไขที่ยังไม่ได้บันทึก ออกจากโหมดแก้ไขหรือไม่?'))return;dirty=false;edit=false}
 else if(a==='save'){await save();return}
 else if(a==='img'){tgt=x;$('file').click();return}
 else if(a==='pimg'){tgt={p:[+x,+y]};$('file').click();return}
 else if(a==='eimg'){tgt={e:[+x,+y]};$('file').click();return}
 else if(a==='addpara'){s.paras.push({text:'',photo:''})}
 else if(a==='delpara'){s.paras.splice(+y,1)}
 else if(a==='qimg'){tgt={q:[+x,+y]};$('file').click();return}
 else if(a==='addtable'){s.cols=['คอลัมน์ 1','คอลัมน์ 2'];s.rows=[['','']]}
 else if(a==='deltable'){if(confirm('ลบตารางของหัวข้อนี้?')){s.cols=[];s.rows=[]}else return}
 else if(a==='adde'){s.entries.push({year:'',name:'',photo:''})}
 else if(a==='dele'){s.entries.splice(+y,1)}
 else if(a==='prev'){bi=(bi-1+S.banners.length)%S.banners.length}
 else if(a==='next'){bi=(bi+1)%S.banners.length}
 else if(a==='addsec'){S.sections.push(newSec('หัวข้อใหม่'));location.hash='#s'+(S.sections.length-1)}
 else if(a==='delsec'){if(confirm('ลบหัวข้อนี้? (กด “บันทึก” เพื่อยืนยันการลบ)')){S.sections.splice(+x,1);location.hash='#info'}else return}
 else if(a==='up'&&+x>0){[S.sections[x-1],S.sections[x]]=[S.sections[x],S.sections[x-1]];location.hash='#s'+(x-1)}
 else if(a==='down'&&+x<S.sections.length-1){[S.sections[+x+1],S.sections[x]]=[S.sections[x],S.sections[+x+1]];location.hash='#s'+(+x+1)}
 else if(a==='addrow'){s.rows.push(s.cols.map(()=>''))}
 else if(a==='delrow'){if(s.rows.length>1)s.rows.pop()}
 else if(a==='addcol'){s.cols.push('คอลัมน์ใหม่');s.rows.forEach(r=>r.push(''))}
 else if(a==='delcol'){if(s.cols.length>1){s.cols.pop();s.rows.forEach(r=>r.pop())}}
 else if(a==='delimg'){s.images.splice(+y,1)}
 else if(a==='delban'){S.banners.splice(+x,1)}
 else if(a==='pv'){openProfile(+x,+y);return}
  else if(a==='addp'){s.people.push({photo:'',name:'',pos:'ศึกษานิเทศก์',rank:'',duty:''})}
 else if(a==='delp'){s.people.splice(+y,1)}
 else if(a==='addnews'){S.news.unshift({date:'',title:'หัวข้อข่าวใหม่',url:''})}
 else if(a==='delnews'){S.news.splice(+x,1)}
 if(a==='prev'||a==='next'){const el=$('sl');if(el)el.outerHTML=slider();return}
 if(edit&&a!=='done')dirty=true;const y0=window.scrollY;render();window.scrollTo(0,y0);
});
(async()=>{
 route();
 try{
  if(window.claude){
   const u=await claude.use('user');canEdit=!!(u&&u.canEdit());
   assets=await claude.use('assets');
   const db=await claude.use('db');
   if(db){dbDoc=db.doc('site/main');
    dbDoc.onSnapshot(sn=>{if(sn.exists&&!edit){try{S=JSON.parse(sn.data().json);norm();render()}catch(e){}}},()=>{});}
   render();
  }else{await standalone()}
 }catch(e){}
})();
</script>
</body>
</html>
